# InfluxDB + Grafana
# Uso: docker compose up -d
# InfluxDB: http://localhost:8086  (crear org "lab", bucket "esp", API Token)
# Grafana:  http://localhost:3000   (admin / admin; añadir datasource InfluxDB)

services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=giar-admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=antartida
      - DOCKER_INFLUXDB_INIT_ORG=lab
      - DOCKER_INFLUXDB_INIT_BUCKET=esp
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=ssvoFRm8Gl0iTw1dqMUoOyf6XmKpfQvMv6d16cFVCb7qG98EVrtt-PmmQnUHew0QgGPwE-PiLAy7R4j5V5PPXw==
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=1234
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb
    restart: unless-stopped

volumes:
  influxdb_data:
  grafana_data:
